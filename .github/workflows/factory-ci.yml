name: Factory Integrated CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static validation (all HTML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile scripts/validate_factory_html.py
      - name: Validate every factory page and local link
        run: python scripts/validate_factory_html.py

  browser-tests:
    name: Playwright browser smoke tests
    runs-on: ubuntu-latest
    needs: static-validation
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python HTTP server
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local test server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/factory-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/factory-http.log
          exit 1
      - name: Run browser tests
        run: npx playwright test tests/browser-smoke.spec.js --reporter=list
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            test-results/
            playwright-report/
            /tmp/factory-http.log
          if-no-files-found: ignore
          retention-days: 7

  source-package:
    name: Package source after successful tests
    runs-on: ubuntu-latest
    needs: [static-validation, browser-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create source ZIP
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/kaustubh-ai-software-factory-source.zip HEAD
      - name: Upload tested source package
        uses: actions/upload-artifact@v4
        with:
          name: kaustubh-ai-software-factory-source
          path: dist/kaustubh-ai-software-factory-source.zip
          if-no-files-found: error
          retention-days: 14
